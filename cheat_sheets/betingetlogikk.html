<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheat sheet for betinget logikk</title>
</head>
<body>

    <p> id="loginStatus">Ikke logget inn</p>

    <script>
        const username = "Gjergj"
        const password = "passord123"
        let loggedIn = false
      

        //IF-test som sjekkker om innsendt brukernavn matcher systemet:
        if(username === "Gjergj") {
            console.log("Brukernavn er riktig")
        } else {
            console.log("Feil brukernavn")
        }

      //IF-test som sjekker om innsendt brukernavn og passord er riktig, og gjør klar login:
      if(username === "Gjergj" && password === "passord123") {
        loggedIn = true
        console.log(loggedIn)
      }

    //Sjekk om en bruker er logget inn, og oppdater grensesnoitt hvis den er det:
     if(loggedIn) {
            document.getElementById("loginStatus").innerHTML = "Hei, Gjergj"
        }

    </script>
</body>
</html>
