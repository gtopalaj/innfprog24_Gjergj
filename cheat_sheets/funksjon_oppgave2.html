<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oppgave 2</title>
</head>
<body>
    
    <script>
          //Oppgave 2:
       const people = ["Marius", "Tore", "Sussanne", "Monica", "Arne", "Zoltan", "Beate"]

       function printNames(array) {

       //sortere array:
       array.sort()

       //lage et ul-element:
       const ul = document.createElement("ul")

       //fylle ul-listen med listeelementer med navn
        array.map(person=>{
            //lage en <li> (listeelement)
            const li = document.createElement("li")
            //få navnet i "person"-parameteren inni <li>
            li.innerHTML = person
            //Legge li elementet inn i ul
            ul.appendChild(li)
            //Legge ul listen på nettsiden
            document.body.appendChild(ul)
        })

       //testutskrift:
       console.log(ul)
       }

       printNames(people)
    </script>
</body>
</html>
